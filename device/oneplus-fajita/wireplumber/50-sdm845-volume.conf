monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "alsa_output.platform-sound.HiFi__Speaker__sink"
      }
    ]
    actions = {
      update-props = {
        node.description = "Built-in Audio Speaker"
        node.volume = 1.0
        audio.max-volume = 1.0
        priority.driver = 1000
        priority.session = 1000
      }
    }
  }
]
